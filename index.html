<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="Elsewhere — type a thought and change the atmosphere. Strictly matched music and moving visuals, with stacking and no API keys.">
  <title>elsewhere — one thought, another world</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>
  <main id="world" aria-label="The atmosphere">
    <div id="bg0" class="background visible" aria-hidden="true">
      <video class="bg-video" muted loop playsinline preload="none"></video>
      <div class="bg-image"></div>
    </div>
    <div id="bg1" class="background" aria-hidden="true">
      <video class="bg-video" muted loop playsinline preload="none"></video>
      <div class="bg-image"></div>
    </div>
    <div id="wash" aria-hidden="true"></div>
    <canvas id="weather" aria-hidden="true"></canvas>
    <div id="shade" aria-hidden="true"></div>
    <div id="flash" aria-hidden="true"></div>
    <section class="center" aria-label="Describe an atmosphere">
      <form id="form" autocomplete="off">
        <div class="field">
          <input id="prompt" aria-label="Describe your vibe" type="text" enterkeyhint="go" autocomplete="off" spellcheck="false" maxlength="180" placeholder="type a feeling, place, or moment…" autofocus>
          <span class="progress" aria-hidden="true"></span>
        </div>
        <label class="stack" title="Stack new prompts onto the last atmosphere">
          <span class="stack-label">stack</span>
          <input id="stack" type="checkbox" role="switch" aria-label="Stacking mode">
          <span class="switch" aria-hidden="true"><span class="knob"></span></span>
        </label>
      </form>
    </section>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <section id="playerDock" class="player-dock" aria-label="Official music player" hidden>
      <div class="player-title">
        <span id="playerName" class="truncate"></span>
        <div class="player-actions">
          <button id="spotifyBtn" type="button" hidden>Spotify</button>
          <button id="appleBtn" type="button" hidden>Apple Music</button>
          <button id="nextBtn" type="button" title="Next song">Next</button>
          <button id="closePlayer" type="button" aria-label="Close player">×</button>
        </div>
      </div>
      <div id="embedSlot"></div>
      <div id="playerHint">Press play in the official player. Full playback depends on your account.</div>
    </section>
    <section id="info" class="info" aria-label="Sources and shortcuts" hidden>
      <div class="info-head"><strong>behind this moment</strong><button id="closeInfo" type="button" aria-label="Close">×</button></div>
      <div id="sources"></div>
      <p class="hint">Enter · transform &nbsp; N · next track &nbsp; R · another background &nbsp; M · mute &nbsp; P · music player &nbsp; I · sources &nbsp; F · fullscreen</p>
    </section>
    <div id="live" role="status" aria-live="polite" class="sr-only"></div>
    <audio id="audio" preload="none"></audio>
  </main>
  <script defer src="./assets/app.js"></script>
</body>
</html>
